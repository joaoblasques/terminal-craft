# ~/.tmux.conf - tmux configuration file

# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Set window and pane index to start at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Better split pane shortcuts
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind %

# Create new window with current path
bind c new-window -c "#{pane_current_path}"

# Better status bar with colors
set -g status-style bg=colour234,fg=colour255
set -g window-status-current-style bg=colour39,fg=colour235,bold
set -g status-left-length 30
set -g status-left '#[fg=colour39,bold][#S] '
set -g status-right '#[fg=colour39,bold]%H:%M #[fg=colour255]| #[fg=colour39,bold]%d-%b-%y '
set -g status-interval 60
set -g status-position top

# Vi mode for copying
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Increase history limit
set -g history-limit 10000

# Enable true color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Add better window navigation
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-S-Left swap-window -t -1\; select-window -t -1
bind -n M-S-Right swap-window -t +1\; select-window -t +1

# Add pane resizing shortcuts
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Smart pane switching with awareness of Vim splits
bind-key -n 'C-h' if-shell "ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(view|n?vim?x?)(diff)?$'" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(view|n?vim?x?)(diff)?$'" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(view|n?vim?x?)(diff)?$'" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(view|n?vim?x?)(diff)?$'" 'send-keys C-l' 'select-pane -R'

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Set escape time to reduce delay
set -sg escape-time 10

# Focus events enabled for terminals that support them
set -g focus-events on

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

